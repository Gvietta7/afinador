<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101217">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Afinador</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app" data-state="idle" data-mode="mic">

    <header class="bar top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><path d="M12 16V9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="12" cy="16" r="1.6" fill="currentColor"/></svg>
        <span>Afinador</span>
      </div>
      <div class="seg" role="tablist" aria-label="Modo de captação">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button class="seg-btn active" data-mode="mic" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
          Microfone
        </button>
        <button class="seg-btn" data-mode="vib" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M3 9v6M21 9v6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
          Vibração
        </button>
      </div>
    </header>

    <section class="stage" aria-live="polite">
      <div class="pill" id="pill">
        <span class="pill-dot" id="pillDot"></span>
        <span id="pillText">Pronto para começar</span>
      </div>

      <div class="dial">
        <svg class="dial-svg" viewBox="0 0 400 236" aria-hidden="true">
          <g id="segments"></g>
          <g class="labels">
            <text x="34" y="226">−50</text>
            <text x="366" y="226">+50</text>
          </g>
          <g id="needle" class="needle">
            <line x1="200" y1="66" x2="200" y2="18" />
          </g>
        </svg>

        <div class="readout">
          <div class="note-row">
            <span class="note" id="note">–</span><span class="octave" id="octave"></span>
          </div>
          <div class="cents" id="cents"><span class="cents-val">0</span><span class="cents-unit">cents</span></div>
          <div class="freq" id="freq">— Hz</div>
        </div>
      </div>

      <div class="advice" id="advice">
        <svg class="advice-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="arrow" d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="check" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="adviceText">Toque uma corda solta</span>
      </div>
    </section>

    <section class="strings" id="strings" aria-label="Corda">
      <span class="strings-thumb" id="stringsThumb" aria-hidden="true"></span>
    </section>

    <footer class="bar bottom">
      <div class="tuning">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.75"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.75"/></svg>
        <span class="tuning-name" id="tuningName">Padrão</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <select id="tuning" aria-label="Afinação"></select>
      </div>

      <button id="toggle" class="start" type="button">
        <span class="start-label">Iniciar</span>
      </button>

      <label class="a4">
        <span>A4</span>
        <input id="a4" type="number" inputmode="numeric" min="400" max="480" step="1" value="440" aria-label="Referência do Lá em hertz">
      </label>
    </footer>

    <p class="detail" id="status"></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
